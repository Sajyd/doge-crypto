<div class="doge-tickets-container">
  <h2>Achat de tickets de transport en DogeCoin</h2>
  <div class="ticket-form">
    <div class="form-group">
      <label for="tickets">Nombre de tickets:</label>
      <input type="number" id="tickets" [(ngModel)]="numberOfTickets" min="1">
    </div>

    <div class="price-info">
      <p>Prix unitaire: ${{ticketPrice}} ({{ticketPrice / dogePrice | number:'1.2-2'}} DOGE)</p>
      <p *ngIf="numberOfTickets >= 2" class="discount">Réduction de 5% appliquée!</p>
      <p class="total">Prix total: ${{totalPriceUSD | number:'1.2-2'}} 
        ({{totalPriceDOGE | number:'1.2-2'}} DOGE)</p>
    </div>

    <button (click)="buyTickets()" class="buy-button">
      <mat-icon>shopping_cart</mat-icon>
      <span class="button-text">Acheter avec DOGE</span>
    </button>
  </div>
</div>
